name: Gerar .exe

# Duas formas de publicar uma versão:
#  1. Mudar o arquivo VERSION (e o NOTAS.md) na main: o GitHub monta o .exe e cria a Release sozinho.
#  2. Publicar uma Release pela página do GitHub: o .exe é montado e anexado nela.
on:
  push:
    branches: [main]
    paths: [VERSION]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ver se é uma versão nova
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content VERSION -TotalCount 1).Trim()
          "tag=v$v" >> $env:GITHUB_OUTPUT
          $novo = "false"
          if ("${{ github.event_name }}" -eq "push") {
            gh release view "v$v" --repo "${{ github.repository }}" 2>$null | Out-Null
            if ($LASTEXITCODE -ne 0) { $novo = "true" } else { Write-Host "A Release v$v já existe; nada a fazer." }
          }
          "nova=$novo" >> $env:GITHUB_OUTPUT
          exit 0

      - uses: actions/setup-python@v5
        if: github.event_name != 'push' || steps.ver.outputs.nova == 'true'
        with:
          python-version: "3.12"

      - name: Instalar dependências (versões exatas do lock, com hashes)
        if: github.event_name != 'push' || steps.ver.outputs.nova == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock

      - name: Gerar ControleCasa.exe
        if: github.event_name != 'push' || steps.ver.outputs.nova == 'true'
        run: >
          pyinstaller --noconfirm --onefile --noconsole --name ControleCasa --icon casa.ico
          --hidden-import positivo
          --add-data "index.html;." --add-data "icone.png;." --add-data "casa.ico;."
          main.py

      - name: Calcular SHA256
        id: hash
        if: github.event_name != 'push' || steps.ver.outputs.nova == 'true'
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/ControleCasa.exe -Algorithm SHA256).Hash.ToLower()
          "$h  ControleCasa.exe" | Out-File -Encoding ascii dist/ControleCasa.exe.sha256
          "sha=$h" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push' || steps.ver.outputs.nova == 'true'
        with:
          name: ControleCasa
          path: |
            dist/ControleCasa.exe
            dist/ControleCasa.exe.sha256

      - name: Anexar na Release publicada pela página
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ControleCasa.exe
            dist/ControleCasa.exe.sha256
          append_body: true
          body: |

            **SHA256 do `ControleCasa.exe`:** `${{ steps.hash.outputs.sha }}`

      - name: Escrever notas da versão
        if: github.event_name == 'push' && steps.ver.outputs.nova == 'true'
        shell: pwsh
        run: |
          $n = Get-Content NOTAS.md -Raw
          "$n`n`n**SHA256 do ``ControleCasa.exe``:** ``${{ steps.hash.outputs.sha }}``" | Out-File -Encoding utf8 notas-release.md

      - name: Criar a Release
        if: github.event_name == 'push' && steps.ver.outputs.nova == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Controle Casa ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: notas-release.md
          files: |
            dist/ControleCasa.exe
            dist/ControleCasa.exe.sha256
