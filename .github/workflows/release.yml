name: Gerar .exe

# Ao publicar uma Release no GitHub (ex.: v1.0.0), monta o ControleCasa.exe e anexa nela.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Gerar ControleCasa.exe
        run: >
          pyinstaller --noconfirm --onefile --noconsole --name ControleCasa --icon casa.ico
          --hidden-import positivo
          --add-data "index.html;." --add-data "icone.png;." --add-data "casa.ico;."
          main.py

      - uses: actions/upload-artifact@v4
        with:
          name: ControleCasa
          path: dist/ControleCasa.exe

      - name: Publicar na Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ControleCasa.exe
